<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fixture — Signup form</title>
    <link rel="stylesheet" href="/pages/shared.css" />
  </head>
  <body>
    <!-- Realistic page chrome: a nav, a footer, helper text, and a summary. -->
    <nav aria-label="Main">
      <a href="/pages/index.html">Home</a>
      <a href="/pages/login.html">Sign in</a>
      <a href="/pages/wizard.html">Help</a>
    </nav>

    <main>
      <h1>Create your account</h1>
      <p>
        It takes less than a minute. We will send a confirmation email to the address you provide.
      </p>

      <form id="signup">
        <label for="fullname">Full name</label>
        <input id="fullname" name="fullname" type="text" aria-describedby="fullname-hint" />
        <p id="fullname-hint">As it appears on your ID.</p>

        <label for="email">Email address</label>
        <input id="email" name="email" type="email" aria-describedby="email-hint" />
        <p id="email-hint">We only use this to confirm your account.</p>

        <label for="password">Password</label>
        <input id="password" name="password" type="password" aria-describedby="password-hint" />
        <p id="password-hint">At least 12 characters.</p>

        <button type="submit" data-testid="create-account">Create account</button>
      </form>

      <p id="signup-status" role="status"></p>
    </main>

    <footer>
      <p>© Fixture Corp. Privacy. Terms. Status.</p>
    </footer>

    <script>
      document.getElementById('signup').addEventListener('submit', (e) => {
        e.preventDefault();
        document.getElementById('signup-status').textContent = 'Account created';
        document.body.setAttribute('data-signup', 'done');
      });
    </script>
  </body>
</html>
