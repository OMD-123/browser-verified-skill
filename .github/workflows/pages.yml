name: demo pages

# The demos are published as a page, because GitHub will not play a
# video in a README -- it strips the <video> tag. GitHub Pages serves an
# mp4 as video/mp4 with range support, so the browser plays it there.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/mcp/demo-page.ts"
      - "scripts/render-demo-page.ts"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci
      - run: npm run demo:page

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "./docs"

      - id: deployment
        uses: actions/deploy-pages@v4
